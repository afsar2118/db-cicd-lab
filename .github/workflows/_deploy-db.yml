name: Deploy DB (reusable)

# Same steps for every environment. The caller passes the environment
# name; GitHub then loads that environment's variables and DB_PASSWORD.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Migrate ${{ inputs.environment }}
    runs-on: [self-hosted, local-db]
    environment: ${{ inputs.environment }}
    env:
      FLYWAY_URL: jdbc:postgresql://${{ vars.DB_HOST }}:${{ vars.DB_PORT }}/${{ vars.DB_NAME }}
      FLYWAY_USER: ${{ vars.DB_USER }}
      FLYWAY_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLYWAY_LOCATIONS: filesystem:db/migrations
      PGHOST: ${{ vars.DB_HOST }}
      PGPORT: ${{ vars.DB_PORT }}
      PGDATABASE: ${{ vars.DB_NAME }}
      PGUSER: ${{ vars.DB_USER }}
      PGPASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Migrations before deploy
        run: flyway info

      - name: Apply pending migrations
        run: flyway migrate

      - name: Smoke test (rolls back, leaves no rows)
        run: |
          for f in db/tests/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Migrations after deploy
        run: |
          flyway info | tee info.txt
          {
            echo "### ${{ inputs.environment }}"
            echo '```'
            cat info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
